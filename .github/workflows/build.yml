name: Build Mewhagram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Mewhagram Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Clone Telegram-FOSS
        run: |
          git clone --depth 1 https://github.com/Telegram-FOSS/Telegram-FOSS.git telegram
          cd telegram
          git submodule update --init --recursive --depth 1

      - name: Apply Mewhagram Modifications
        run: |
          python3 apply_mewha_patches.py telegram

      - name: Build APK with Gradle
        run: |
          cd telegram
          ./gradlew assembleAfatRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload Mewhagram APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mewhagram-APK
          path: telegram/TMessagesProj/build/outputs/apk/**/*.apk
